version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: tenancy-app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    ports:
      - '${APP_PORT:-8080}:8000'
      - '${VITE_PORT:-5174}:${VITE_PORT:-5174}'
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: tenancy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      # MYSQL_USER: '${DB_USERNAME}'
      # MYSQL_PASSWORD: '${DB_PASSWORD}'
    ports:
    - '${FORWARD_DB_PORT:-33306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: tenancy-mailpit
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
  mysql-data: